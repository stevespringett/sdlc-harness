# Publishes a GitHub Release when scripts/release.mjs's tag (v<x.y.z>) is
# pushed: checks every version field matches the tag, runs the testCommand,
# and uses the newest dated CHANGELOG.md section as the notes.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check every version field matches the tag
        run: node scripts/release.mjs --check "$GITHUB_REF_NAME"
      - name: Run the repo's testCommand
        run: node -e "process.stdout.write(require('./.sdlc-harness/sdlc.json').testCommand)" > "$RUNNER_TEMP/test.sh" && sh "$RUNNER_TEMP/test.sh"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs --notes > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
